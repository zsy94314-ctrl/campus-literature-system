server:
  port: 8080

spring:
  application:
    name: campus-literature-system
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/campus_literature_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.campus.literature.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: ${JWT_SECRET:campus-literature-system-demo-secret}
  expiration: 86400000  # 24小时，单位毫秒

# AI 服务配置
ai:
  service:
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}

# 日志配置
logging:
  level:
    com.campus.literature.mapper: debug
    org.springframework.security: debug
