services:
  mysql:
    image: mysql:8.0
    container_name: campus-literature-mysql
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campus_literature_system}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-strong-password}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init-all.sql:/docker-entrypoint-initdb.d/init-all.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - campus-literature-network

  backend-ai:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
    container_name: campus-literature-backend-ai
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - backend-ai-data:/app/data
    networks:
      - campus-literature-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: campus-literature-backend-java
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/campus_literature_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-strong-password}
      JWT_SECRET: ${JWT_SECRET:-campus-literature-system-demo-secret}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://backend-ai:8000}
    depends_on:
      mysql:
        condition: service_healthy
      backend-ai:
        condition: service_healthy
    networks:
      - campus-literature-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus-literature-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend-java
    networks:
      - campus-literature-network

volumes:
  mysql-data:
  backend-ai-data:

networks:
  campus-literature-network:
    driver: bridge
